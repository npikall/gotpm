name: Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"

permissions: {}

# mike commits every deployment to the gh-pages branch, so runs must not race.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write # required for mike to push to the gh-pages branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # mike reads and rewrites the whole gh-pages history.
          fetch-depth: 0
          # mike pushes the built site itself, so it needs the credentials.
          persist-credentials: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # docs/reference.md includes these snippets and the build fails without them.
      - run: ./scripts/gen-cli-docs.sh
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x
      - run: pip install zensical markdown-callouts git+https://github.com/squidfunk/mike.git
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Deploy development documentation
        if: github.ref_type == 'branch'
        run: mike deploy --push dev
      - name: Deploy release documentation
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          mike deploy --push --update-aliases "${version%.*}" latest
          mike set-default --push latest
