# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            suffix: linux-arm64
          - os: ubuntu-latest
            goos: windows
            goarch: amd64
            suffix: windows-amd64.exe
          - os: ubuntu-latest
            goos: windows
            goarch: arm64
            suffix: windows-arm64.exe
          - os: macos-latest
            goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            suffix: darwin-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Just
        uses: taiki-e/install-action@just

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ github.ref_name }}
          INSTALLER: release
        run: just build && mv gotpm gotpm-${{ matrix.suffix }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gotpm-${{ matrix.suffix }}
          path: gotpm-${{ matrix.suffix }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate install scripts
        run: |
          sed 's/{{VERSION}}/${{ github.ref_name }}/g' scripts/install.sh.tmpl > artifacts/install.sh
          sed 's/{{VERSION}}/${{ github.ref_name }}/g' scripts/install.ps1.tmpl > artifacts/install.ps1

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum gotpm-* > checksums.txt

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Run git-cliff
        run: git cliff -v --latest --no-exec --strip header --output release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x artifacts/gotpm-linux-* artifacts/gotpm-darwin-* artifacts/install.sh
          gh release create ${{ github.ref_name }} artifacts/* \
            --repo ${{ github.repository }} \
            --title "GoTPM - ${{ github.ref_name }}" \
            --notes-file release-notes.md \
            --fail-on-no-commits \
            --draft
