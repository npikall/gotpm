# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            suffix: linux-arm64
          - os: ubuntu-latest
            goos: windows
            goarch: amd64
            suffix: windows-amd64.exe
          - os: ubuntu-latest
            goos: windows
            goarch: arm64
            suffix: windows-arm64.exe
          - os: macos-latest
            goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            suffix: darwin-arm64

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # required to upload release artifacts
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Tool Just
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2.82.2
        with:
          tool: just

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ github.ref_name }}
          INSTALLER: release
          BINARY_SUFFIX: ${{ matrix.suffix }}
        run: just build && mv gotpm gotpm-${BINARY_SUFFIX}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gotpm-${{ matrix.suffix }}
          path: gotpm-${{ matrix.suffix }}

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the release and upload assets
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Install Tool Git-Cliff
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2.82.2
        with:
          tool: git-cliff

      - name: Generate install scripts
        run: |
          sed 's/{{VERSION}}/${{ github.ref_name }}/g' scripts/install.sh.tmpl > artifacts/install.sh
          sed 's/{{VERSION}}/${{ github.ref_name }}/g' scripts/install.ps1.tmpl > artifacts/install.ps1

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum gotpm-* > checksums.txt

      - name: Run git-cliff
        run: git cliff -v --latest --no-exec --strip header --output release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          chmod +x artifacts/gotpm-linux-* artifacts/gotpm-darwin-* artifacts/install.sh
          gh release create ${GITHUB_REF_NAME} artifacts/* \
            --repo ${GH_REPO} \
            --title "GoTPM - ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --fail-on-no-commits \
            --draft
